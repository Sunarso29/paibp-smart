<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uji Server PAIBP SMART V65</title><script src="app-config.js?v=65"></script><style>body{font-family:system-ui;margin:0;min-height:100vh;display:grid;place-items:center;background:#073e34;color:#12382f}.card{width:min(620px,92%);padding:28px;border-radius:24px;background:#fff;text-align:center}.status{font-size:1.5rem;font-weight:900}.ok{color:#08745d}.bad{color:#b52839}button,a{display:inline-block;margin:5px;padding:12px 16px;border:0;border-radius:12px;background:#08745d;color:#fff;font-weight:850;text-decoration:none}pre{text-align:left;white-space:pre-wrap;background:#edf7f3;padding:12px;border-radius:12px}</style></head><body><main class="card"><h1>Uji Server PAIBP SMART V65</h1><p id="status" class="status">Menguji…</p><pre id="detail"></pre><button id="retry">Uji Lagi</button><a href="akses-guru.html?v=65">Buka Portal Guru</a></main><script>(()=>{const endpoint=String(window.PAIBP_CONFIG?.syncEndpoint||''),status=document.getElementById('status'),detail=document.getElementById('detail');function call(action,params={}){return new Promise((resolve,reject)=>{const cb=`testV65_${Date.now()}_${Math.random().toString(36).slice(2)}`,s=document.createElement('script'),u=new URL(endpoint);let done=false;const finish=(e,v)=>{if(done)return;done=true;clearTimeout(t);try{delete window[cb]}catch{}s.remove();e?reject(e):resolve(v)};window[cb]=v=>finish(null,v);Object.entries({action,callback:cb,_v:Date.now(),...params}).forEach(([k,v])=>u.searchParams.set(k,v));s.src=u.href;s.onerror=()=>finish(new Error('Script JSONP gagal dimuat'));const t=setTimeout(()=>finish(new Error('Timeout 10 detik')),10000);document.head.append(s)})}async function run(){status.className='status';status.textContent='Menguji server…';detail.textContent='';try{const health=await call('health'),cls=await call('classStatusV65',{classCode:'VIIA'});if(!health?.ok||!cls?.ok)throw new Error(health?.error||cls?.error||'Respons tidak valid');status.className='status ok';status.textContent='Server tersambung';detail.textContent=`Backend versi: ${health.version}\nRealtime: ${health.realtime}\nCAT V65: ${cls.ok?'siap':'belum siap'}\nWaktu server: ${health.serverTime||cls.serverTime||'-'}`}catch(e){status.className='status bad';status.textContent='Server belum tersambung';detail.textContent=e.message||String(e)}}document.getElementById('retry').onclick=run;run()})();</script></body></html>
