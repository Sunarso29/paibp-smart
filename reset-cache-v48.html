<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pemulihan PAIBP SMART V48</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#073f34;color:#fff;font-family:Arial,sans-serif}.box{width:min(88vw,520px);padding:32px;border-radius:24px;background:#fff;color:#123f36;text-align:center}.spin{width:46px;height:46px;margin:auto;border:5px solid #dcece7;border-top-color:#0a7f68;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style><link rel="stylesheet" href="visual-v84.css?v=84"></head><body><main class="box"><div class="spin"></div><h1>Memulihkan PAIBP SMART</h1><p>Membersihkan cache lama dan membuka versi V48 yang ringan.</p></main><script>(async()=>{try{localStorage.removeItem('paibp-smart-v48-cache-reset');if('caches'in window){for(const key of await caches.keys())await caches.delete(key)}if('serviceWorker'in navigator){for(const reg of await navigator.serviceWorker.getRegistrations())await reg.unregister()}}catch{}setTimeout(()=>location.replace('index.html?v=48&fresh='+Date.now()),900)})();</script></body></html>
