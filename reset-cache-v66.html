<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset V66</title><style>body{font-family:system-ui;margin:0;min-height:100vh;display:grid;place-items:center;background:#073e34}.c{width:min(560px,90%);background:#fff;padding:28px;border-radius:24px;text-align:center;color:#12382f}a{display:inline-block;padding:13px 18px;border-radius:13px;background:#08745d;color:#fff;text-decoration:none;font-weight:800}</style></head><body><main class="c"><h1>Reset PAIBP SMART V66</h1><p id="s">Membersihkan cache teknis…</p><a id="a" hidden>Buka PAIBP SMART</a></main><script>(async()=>{const s=document.getElementById('s'),a=document.getElementById('a');try{for(const st of [localStorage,sessionStorage])for(let i=st.length-1;i>=0;i--){const k=st.key(i)||'';if(/paibp-smart-(?:cat|class|student-session|policy-cache)|paibp-smart-v\d+-cache-reset/i.test(k))st.removeItem(k)}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}if(navigator.serviceWorker){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}s.textContent='Reset teknis selesai. Identitas murid tetap tersimpan.';a.href='index.html?v=66&t='+Date.now();a.hidden=false}catch(e){s.textContent='Reset selesai sebagian. Tutup browser lalu buka lagi.';a.href='index.html?v=66&t='+Date.now();a.hidden=false}})();</script></body></html>
