<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Total PAIBP SMART V64</title><style>body{font-family:system-ui;margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#063e34,#145b8f);color:#fff}.card{width:min(560px,90%);padding:30px;border-radius:24px;background:#fff;color:#12382f;text-align:center;box-shadow:0 25px 70px #0005}a{display:inline-block;border-radius:14px;padding:13px 18px;background:#08745d;color:#fff;font-weight:800;text-decoration:none}</style><link rel="stylesheet" href="visual-v84.css?v=84"><link rel="stylesheet" href="visual-v85.css?v=85"><link rel="stylesheet" href="icon-depth-v85.css?v=85"></head><body><main class="card"><h1>Reset Total V64</h1><p id="status">Menghapus seluruh sesi CAT dan kelas lama…</p><a id="open" hidden>Buka PAIBP SMART Bersih</a></main><script>(async()=>{const status=document.getElementById('status'),open=document.getElementById('open');try{for(const store of [localStorage,sessionStorage]){for(let i=store.length-1;i>=0;i--){const key=store.key(i)||'';if(/paibp-smart-(?:cat|class|student-session|focus-session)|paibp-smart-v\d+-cache-reset/i.test(key))store.removeItem(key)}}if('caches'in window){await Promise.all((await caches.keys()).map(key=>caches.delete(key)))}if(navigator.serviceWorker){await Promise.all((await navigator.serviceWorker.getRegistrations()).map(reg=>reg.unregister()))}if(indexedDB.databases){for(const db of await indexedDB.databases()){if(/paibp/i.test(db.name||''))indexedDB.deleteDatabase(db.name)}}status.textContent='Reset selesai. Kelas VIIIB dan seluruh sesi lama sudah dihapus dari perangkat ini.';open.href=`index.html?v=64&clean=${Date.now()}`;open.hidden=false}catch(error){status.textContent='Reset selesai sebagian. Tutup seluruh tab browser lalu buka kembali.';open.href=`index.html?v=64&clean=${Date.now()}`;open.hidden=false}})();</script></body></html>
