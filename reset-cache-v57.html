<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pembersihan V57</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#043c35,#123d6c,#642e8e);font-family:Arial,sans-serif;color:#fff}.card{width:min(520px,88vw);padding:32px;border:2px solid rgba(255,255,255,.28);border-radius:24px;background:rgba(4,42,36,.82);box-shadow:0 24px 60px rgba(0,0,0,.3);text-align:center}.mark{font-size:3rem}.card h1{margin:12px 0 8px}.card p{line-height:1.55;color:#dcfff3}.card a{display:inline-block;margin-top:12px;padding:13px 18px;border-radius:13px;background:#ffc43d;color:#312100;font-weight:900;text-decoration:none}</style></head><body><main class="card"><div class="mark">✓</div><h1>V57 siap digunakan</h1><p id="status">Membersihkan cache lama dan memuat perbaikan visual…</p><a id="home" href="index.html?v=57" hidden>Kembali ke Beranda</a></main><script>(async()=>{const status=document.getElementById('status'),home=document.getElementById('home');try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(reg=>reg.unregister()));}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(key=>caches.delete(key)));}Object.keys(localStorage).filter(key=>/paibp-smart-v(?:5[0-6])-cache-reset/i.test(key)).forEach(key=>localStorage.removeItem(key));localStorage.setItem('paibp-smart-v57-cache-reset','done');status.textContent='Cache lama sudah dibersihkan. Perbaikan kontras dan media V57 sudah aktif.';}catch(error){status.textContent='Pembersihan selesai. Silakan kembali ke beranda.';}home.hidden=false;setTimeout(()=>location.replace('index.html?v=57&refresh='+Date.now()),1800);})();</script></body></html>
