<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uji Server PAIBP SMART</title><script src="app-config.js?v=85"></script><style>body{font-family:system-ui;margin:0;min-height:100vh;display:grid;place-items:center;background:#073e34;color:#12382f}.card{width:min(620px,92%);padding:28px;border-radius:24px;background:#fff;text-align:center}.status{font-size:1.55rem;font-weight:900}.ok{color:#08745d}.bad{color:#b52839}button,a{display:inline-block;margin:5px;padding:12px 16px;border:0;border-radius:12px;background:#08745d;color:#fff;font-weight:850;text-decoration:none}pre{text-align:left;white-space:pre-wrap;background:#edf7f3;padding:12px;border-radius:12px}</style><link rel="stylesheet" href="visual-v84.css?v=84"><link rel="stylesheet" href="visual-v85.css?v=85"><link rel="stylesheet" href="icon-depth-v85.css?v=85"></head><body><main class="card"><h1>Uji Server PAIBP SMART V69</h1><p id="status" class="status">Menguji…</p><pre id="detail"></pre><button id="retry">Uji Lagi</button><a href="akses-guru.html?v=69">Buka Portal Guru</a></main><script>(()=>{const E=String(window.PAIBP_CONFIG?.syncEndpoint||''),S=document.getElementById('status'),D=document.getElementById('detail');async function call(action,params={}){const u=new URL(E);u.searchParams.set('action',action);u.searchParams.set('_t',Date.now());Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,String(v??'')));const c=new AbortController(),t=setTimeout(()=>c.abort(),10000);try{const r=await fetch(u,{mode:'cors',cache:'no-store',headers:{Accept:'application/json'},signal:c.signal});const x=await r.text();let d;try{d=JSON.parse(x)}catch{throw new Error('Respons server bukan JSON')};return d}finally{clearTimeout(t)}}async function run(){S.className='status';S.textContent='Menguji server…';D.textContent='';try{const h=await call('health'),c=await call('classStatusV66',{classCode:'VIIA'});if(!h?.ok||!c?.ok)throw new Error(h?.error||c?.error||'Respons tidak valid');S.className='status ok';S.textContent='SERVER TERSAMBUNG';D.textContent=`Backend aktif: versi ${h.version}\nTransport: Cloudflare Worker Fetch\nRealtime: ${h.realtime}\nKendali kelas: siap\nWaktu server: ${h.serverTime||c.serverTime||'-'}`}catch(e){S.className='status bad';S.textContent='SERVER BELUM TERSAMBUNG';D.textContent=e.name==='AbortError'?'Server tidak menjawab dalam 10 detik':(e.message||String(e))}}document.getElementById('retry').onclick=run;run()})();</script></body></html>
