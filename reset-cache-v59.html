<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memperbarui PAIBP SMART V59</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#053f36,#185381 62%,#713da4);font-family:system-ui,sans-serif;color:#fff}.card{width:min(560px,calc(100% - 32px));padding:34px;border:1px solid #ffffff33;border-radius:28px;background:#ffffff17;box-shadow:0 30px 90px #0006;text-align:center;backdrop-filter:blur(12px)}.spin{width:58px;height:58px;margin:0 auto 18px;border:7px solid #ffffff38;border-top-color:#ffc43d;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}h1{margin:0 0 10px;font-size:clamp(1.5rem,5vw,2.4rem)}p{line-height:1.6;color:#e5fff6}</style></head><body><main class="card"><div class="spin"></div><h1>Memasang PAIBP SMART V59</h1><p id="status">Membersihkan cache lama dan menyiapkan CAT kamera bertimer…</p></main><script>
(async()=>{
 const status=document.querySelector('#status');
 try{
   const regs=await navigator.serviceWorker?.getRegistrations?.()||[];
   await Promise.all(regs.map(async reg=>{try{reg.active?.postMessage?.({type:'CLEAR_ALL_CACHES'});}catch{} await reg.unregister();}));
   const keys=await caches.keys(); await Promise.all(keys.map(key=>caches.delete(key)));
   [
    'paibp-smart-v56-cache-reset','paibp-smart-v57-cache-reset','paibp-smart-v58-cache-reset',

    'paibp-smart-focus-session-v44','paibp-smart-focus-session-v48','paibp-smart-focus-session-v50'
   ].forEach(key=>{try{sessionStorage.removeItem(key);localStorage.removeItem(key);}catch{}});
   localStorage.setItem('paibp-smart-v59-cache-reset','done');
   status.textContent='Pembaruan selesai. Membuka aplikasi…';
 }catch(error){status.textContent='Pembersihan selesai sebagian. Membuka aplikasi dengan versi terbaru…';}
 setTimeout(()=>location.replace('index.html?v=59&refresh='+Date.now()),900);
})();
</script></body></html>
