<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uji Server V66</title><script src="app-config.js?v=66"></script><style>body{font-family:system-ui;margin:0;min-height:100vh;display:grid;place-items:center;background:#073e34;color:#12382f}.card{width:min(620px,92%);padding:28px;border-radius:24px;background:#fff;text-align:center}.status{font-size:1.55rem;font-weight:900}.ok{color:#08745d}.bad{color:#b52839}button,a{display:inline-block;margin:5px;padding:12px 16px;border:0;border-radius:12px;background:#08745d;color:#fff;font-weight:850;text-decoration:none}pre{text-align:left;white-space:pre-wrap;background:#edf7f3;padding:12px;border-radius:12px}</style></head><body><main class="card"><h1>Uji Server PAIBP SMART V66</h1><p id="status" class="status">Menguji…</p><pre id="detail"></pre><button id="retry">Uji Lagi</button><a href="akses-guru.html?v=66">Buka Portal Guru</a></main><script>(()=>{const E=String(window.PAIBP_CONFIG?.syncEndpoint||''),S=document.getElementById('status'),D=document.getElementById('detail');let f=null,ready=null,pending=new Map();window.addEventListener('message',ev=>{if(!f||ev.source!==f.contentWindow)return;const m=ev.data||{};if(m.type==='PAIBP_V66_READY'){f.dataset.ready='yes';f.dispatchEvent(new Event('ready'));return}if(m.type==='PAIBP_V66_RES'&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);clearTimeout(p.t);m.error?p.j(new Error(m.error)):p.r(m.result)}});function bridge(){if(ready)return ready;ready=new Promise((r,j)=>{f=document.createElement('iframe');f.style='position:fixed;width:1px;height:1px;left:-100px;opacity:0;border:0';const u=new URL(E);u.searchParams.set('bridge','1');u.searchParams.set('_t',Date.now());f.src=u.href;const t=setTimeout(()=>j(new Error('Bridge tidak menjawab dalam 10 detik')),10000);f.addEventListener('ready',()=>{clearTimeout(t);r()}, {once:true});f.onerror=()=>{clearTimeout(t);j(new Error('Bridge gagal dimuat'))};document.body.append(f)}).catch(e=>{ready=null;throw e});return ready}async function call(action,params={}){await bridge();return new Promise((r,j)=>{const id='t'+Date.now()+Math.random().toString(36).slice(2),t=setTimeout(()=>{pending.delete(id);j(new Error('Respons bridge timeout'))},8000);pending.set(id,{r,j,t});f.contentWindow.postMessage({type:'PAIBP_V66_REQ',id,action,params},'*')})}async function run(){S.className='status';S.textContent='Menguji server…';D.textContent='';try{const h=await call('health'),c=await call('classStatusV66',{classCode:'VIIA'});if(!h?.ok||!c?.ok)throw new Error(h?.error||c?.error||'Respons tidak valid');S.className='status ok';S.textContent='Server tersambung';D.textContent=`Backend versi: ${h.version}\nTransport: Apps Script Bridge\nRealtime: ${h.realtime}\nCAT V66: siap\nWaktu server: ${h.serverTime||c.serverTime||'-'}`}catch(e){S.className='status bad';S.textContent='Server belum tersambung';D.textContent=e.message||String(e)}}document.getElementById('retry').onclick=run;run()})();</script></body></html>
