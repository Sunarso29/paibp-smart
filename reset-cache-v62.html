<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset PAIBP SMART V62</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#053d34,#175c90,#7142a0);font-family:Arial,sans-serif;color:#14372f}.card{width:min(620px,100%);padding:30px;border-radius:28px;background:#fff;box-shadow:0 28px 80px rgba(0,0,0,.3);text-align:center}.icon{font-size:3rem}h1{margin:.4rem 0}.status{margin:18px 0;padding:14px;border-radius:14px;background:#edf8f4;font-weight:800}.go{display:inline-grid;place-items:center;min-height:48px;padding:0 22px;border-radius:14px;background:#08745d;color:#fff;text-decoration:none;font-weight:900}</style></head><body><main class="card"><div class="icon">✓</div><h1>Reset PAIBP SMART V62</h1><p>Cache tampilan lama sedang dibersihkan agar foto dan warna Kepala Sekolah tampil sempurna.</p><div class="status" id="status">Memproses…</div><a class="go" href="about-spensus.html">Buka About Spensus</a></main><script>(async()=>{const s=document.getElementById('status');try{if('caches'in window){const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)))}if('serviceWorker'in navigator){const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()))}localStorage.removeItem('paibp-smart-v61-cache-reset');localStorage.setItem('paibp-smart-v62-cache-reset','done');s.textContent='Reset berhasil. Buka About Spensus.'}catch(e){s.textContent='Reset selesai sebagian. Tutup browser lalu buka kembali.'}})();</script></body></html>
