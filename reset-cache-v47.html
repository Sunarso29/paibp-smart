<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Memulihkan PAIBP SMART</title><style>body{font-family:system-ui;margin:0;min-height:100vh;display:grid;place-items:center;background:#063d32;color:#fff}.box{width:min(560px,calc(100% - 36px));padding:28px;border-radius:24px;background:#fff;color:#123c33;text-align:center}.spin{width:48px;height:48px;margin:0 auto 18px;border:5px solid #d8eee7;border-top-color:#087a63;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}button{border:0;border-radius:12px;padding:12px 17px;background:#087a63;color:#fff;font-weight:800}</style><link rel="stylesheet" href="visual-v84.css?v=84"></head><body><main class="box"><div class="spin"></div><h1>Memulihkan portal</h1><p id="status">Menghapus cache lama yang menyebabkan halaman tidak responsif…</p><button id="go" hidden>Buka PAIBP SMART</button></main><script>(async()=>{const s=document.querySelector('#status'),b=document.querySelector('#go');try{if('caches'in window){const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)))}if('serviceWorker'in navigator){const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.update().catch(()=>{})))}localStorage.setItem('paibp-smart-cache-clean-v47','done');s.textContent='Pemulihan selesai. Membuka portal versi ringan…';setTimeout(()=>location.replace('./?v=47&fresh='+Date.now()),700)}catch(e){s.textContent='Klik tombol untuk membuka portal.';b.hidden=false;b.onclick=()=>location.replace('./?v=47&fresh='+Date.now())}})();</script></body></html>
