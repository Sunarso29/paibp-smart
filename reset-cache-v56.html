<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset PAIBP SMART V56</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#063f35,#163d69,#7547bd);font-family:Arial,sans-serif;color:#fff}.card{width:min(560px,100%);padding:28px;border:1px solid rgba(255,255,255,.22);border-radius:24px;background:rgba(255,255,255,.12);backdrop-filter:blur(12px);box-shadow:0 25px 70px rgba(0,0,0,.25);text-align:center}.card h1{margin:0 0 8px}.card p{line-height:1.6}.card a{display:inline-block;margin-top:10px;padding:13px 18px;border-radius:13px;background:#f1b72e;color:#3d2c00;font-weight:900;text-decoration:none}.status{margin:15px 0;padding:12px;border-radius:12px;background:rgba(255,255,255,.12)}</style><link rel="stylesheet" href="visual-v84.css?v=84"><link rel="stylesheet" href="visual-v85.css?v=85"><link rel="stylesheet" href="icon-depth-v85.css?v=85"></head><body><main class="card"><h1>PAIBP SMART V56</h1><p>Membersihkan mesin lama dan memuat kendali kelas, CAT bertimer, visual tertanam, serta sinkronisasi real-time.</p><div class="status" id="status">Sedang membersihkan cache…</div><a href="index.html?v=56" id="home" hidden>Kembali ke Beranda</a></main><script>(async()=>{const status=document.getElementById('status'),home=document.getElementById('home');try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const reg of regs){try{reg.active?.postMessage({type:'CLEAR_ALL_CACHES'});await reg.update();}catch{}}}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(key=>caches.delete(key)));}['paibp-smart-v55-cache-reset','paibp-smart-v54-cache-reset','paibp-smart-v53-cache-reset','paibp-smart-v52-cache-reset'].forEach(key=>localStorage.removeItem(key));localStorage.setItem('paibp-smart-v56-cache-reset','done');status.textContent='Cache lama berhasil dibersihkan. V56 siap digunakan.';}catch(error){status.textContent='Pembersihan selesai sebagian. Tetap lanjutkan ke beranda.';}home.hidden=false;})();</script></body></html>
