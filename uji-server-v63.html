<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uji Server V63</title><style>body{font-family:system-ui;margin:0;min-height:100vh;display:grid;place-items:center;background:#063e34;color:#12382f}.card{width:min(620px,90%);padding:30px;border-radius:24px;background:#fff;text-align:center}.ok{color:#08745d}.bad{color:#b42318}a{display:inline-block;margin-top:15px;padding:12px 17px;border-radius:13px;background:#08745d;color:#fff;text-decoration:none;font-weight:800}</style><link rel="stylesheet" href="visual-v84.css?v=84"><link rel="stylesheet" href="visual-v85.css?v=85"><link rel="stylesheet" href="icon-depth-v85.css?v=85"></head><body><main class="card"><h1>Uji Server PAIBP SMART V63</h1><h2 id="status">Menghubungkan…</h2><p id="detail"></p><a href="akses-guru.html">Buka Portal Guru</a></main><script src="app-config.js?v=85"></script><script>(()=>{const s=document.getElementById('status'),d=document.getElementById('detail');const ep=window.PAIBP_CONFIG?.syncEndpoint||'';if(!ep){s.className='bad';s.textContent='Alamat server kosong';return}const cb='ujiV63_'+Date.now();const x=document.createElement('script');const u=new URL(ep);let done=false;const finish=(ok,msg)=>{if(done)return;done=true;clearTimeout(t);delete window[cb];x.remove();s.className=ok?'ok':'bad';s.textContent=ok?'Server tersambung':'Server belum tersambung';d.textContent=msg};window[cb]=(r)=>finish(Boolean(r?.ok),r?.ok?`Backend versi ${r.version||'-'} aktif.`:(r?.error||'Respons server tidak valid.'));u.searchParams.set('action','health');u.searchParams.set('callback',cb);u.searchParams.set('_v',Date.now());x.src=u.href;x.onerror=()=>finish(false,'Edit deployment yang sama: Jalankan sebagai Saya dan akses Siapa saja.');document.head.append(x);const t=setTimeout(()=>finish(false,'Server melewati batas waktu. Periksa akses deployment.'),10000)})();</script></body></html>
