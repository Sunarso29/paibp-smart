<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset PAIBP SMART V65</title><style>body{font-family:system-ui;margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#063e34,#155f91);color:#fff}.card{width:min(560px,90%);padding:28px;border-radius:24px;background:#fff;color:#12382f;text-align:center;box-shadow:0 22px 60px #0005}a,button{display:inline-block;margin:5px;border:0;border-radius:13px;padding:12px 16px;background:#08745d;color:#fff;font-weight:850;text-decoration:none}</style></head><body><main class="card"><h1>Reset PAIBP SMART V65</h1><p id="status">Membersihkan sesi CAT dan cache lama tanpa menghapus identitas murid…</p><a id="open" href="index.html?v=65" hidden>Buka PAIBP SMART</a><button id="identity" hidden>Hapus Identitas Murid Juga</button></main><script>(async()=>{const s=document.getElementById('status'),a=document.getElementById('open'),b=document.getElementById('identity');try{const keep='paibp-smart-student-identity-v1';for(const store of [localStorage,sessionStorage]){for(let i=store.length-1;i>=0;i--){const k=store.key(i)||'';if(k===keep)continue;if(/paibp-smart-(?:cat|class|student-session|focus|policy-cache|draft)|paibp-smart-v\d+-cache-reset/i.test(k))store.removeItem(k)}}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}if(navigator.serviceWorker){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}s.textContent='Reset selesai. Sesi CAT lama dibersihkan; identitas murid tetap tersimpan agar tidak perlu mengisi ulang.';a.href=`index.html?v=65&t=${Date.now()}`;a.hidden=false;b.hidden=false;b.onclick=()=>{localStorage.removeItem(keep);s.textContent='Identitas murid juga sudah dihapus.'}}catch(e){s.textContent='Reset sebagian selesai. Tutup browser lalu buka kembali.';a.hidden=false}})();</script></body></html>
