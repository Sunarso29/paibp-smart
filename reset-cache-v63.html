<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset PAIBP SMART V63</title><style>body{font-family:system-ui;margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#063e34,#145b8f);color:#fff}.card{width:min(560px,90%);padding:30px;border-radius:24px;background:#fff;color:#12382f;text-align:center;box-shadow:0 25px 70px #0005}button,a{display:inline-block;border:0;border-radius:14px;padding:13px 18px;background:#08745d;color:#fff;font-weight:800;text-decoration:none}</style><link rel="stylesheet" href="visual-v84.css?v=84"></head><body><main class="card"><h1>Reset PAIBP SMART V63</h1><p id="status">Membersihkan cache, sesi CAT lama, dan kelas terhubung…</p><a id="open" href="index.html?v=63" hidden>Buka PAIBP SMART</a></main><script>(async()=>{const s=document.getElementById('status'),a=document.getElementById('open');try{for(const store of [localStorage,sessionStorage]){for(let i=store.length-1;i>=0;i--){const k=store.key(i)||'';if(/paibp-smart-(?:cat|class|student-session)|paibp-smart-v\d+-cache-reset/i.test(k)||k==='paibp-smart-student-identity-v1')store.removeItem(k)}}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}if(navigator.serviceWorker){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}s.textContent='Reset selesai. Semua CAT lama dan kelas terhubung telah dihapus pada perangkat ini.';a.href=`index.html?v=63&t=${Date.now()}`;a.hidden=false}catch(e){s.textContent='Reset selesai sebagian. Tutup browser lalu buka kembali PAIBP SMART.';a.hidden=false}})();</script></body></html>
