name: V80 restore worship and teacher portal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v80-restore-worship-teacher.yml'

permissions:
  contents: write

jobs:
  restore:
    if: contains(github.event.head_commit.message, 'V80 trigger worship and full teacher portal restore')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore complete worship and full teacher portal
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('app-config.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('v79-quran-feature-restore-plus-v76-root-fix','v80-worship-teacher-restore-plus-v79-quran')
          s=s.replace('const VERSION = "79";','const VERSION = "80";',1)
          s=s.replace('button.dataset.v79','button.dataset.v80').replace('button.dataset.v79 = "1"','button.dataset.v80 = "1"')
          s=s.replace('PAIBP V79 visual runtime','PAIBP V80 visual runtime')
          s=s.replace('PAIBP V79 workspace core','PAIBP V80 workspace core')

          visual='      await script("v39-upgrade.js");\n      document.documentElement.dataset.portalUi = "v39-colorful-restored";'
          visual_new='      await script("v39-upgrade.js");\n      /* V80 mengembalikan Simulasi Ibadah lengkap tanpa mengubah Quran V79. */\n      await script("worship-restore-v80.js");\n      document.documentElement.dataset.portalUi = "v39-colorful-restored";'
          if visual not in s:
              raise SystemExit('Titik pemasangan worship V80 tidak ditemukan')
          s=s.replace(visual,visual_new,1)

          old_gate='      if (name === "student" || name === "games") return;'
          new_gate='      if (name === "student" || name === "games" || name === "teacher" || name === "editor") return;'
          if old_gate not in s:
              raise SystemExit('Gate panel tidak ditemukan')
          s=s.replace(old_gate,new_gate,1)

          old_block='''    if (/^(akses-guru|kendali-editor)\\.html$/.test(page)) {\n      script("teacher-cat-v72.js").catch(() => {});\n      return;\n    }'''
          new_block='''    if (page === "akses-guru.html") {\n      /* Portal Guru V80: muat kembali seluruh perangkat guru; CAT hanya salah satu alat. */\n      setPortalMode("active", "guru");\n      style("cp2025-v48.css");\n      Promise.all([\n        loadWorkspaceCore(),\n        script("teacher-cat-v72.js"),\n        script("cp2025-loader-v48.js").then(() => script("cp2025-exact-v56.js")).catch(() => false)\n      ]).then(() => {\n        setPortalMode("active", "guru");\n        document.documentElement.dataset.teacherPortal = "full-v80";\n        const trigger = document.querySelector("#teacher-gateway-trigger");\n        if (trigger) trigger.click();\n        else openPanel("teacher");\n      }).catch((error) => console.error("PAIBP V80 Portal Guru", error));\n      return;\n    }\n\n    if (page === "kendali-editor.html") {\n      script("teacher-cat-v72.js").catch(() => {});\n      return;\n    }'''
          if old_block not in s:
              raise SystemExit('Blok akses-guru lama tidak ditemukan')
          s=s.replace(old_block,new_block,1)
          p.write_text(s,encoding='utf-8')

          p=Path('teacher-cat-v72.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('const V="72"','const V="80"',1)
          old='const host=$("main")||document.body;const p=document.createElement("section");p.id="v72-cat";'
          new='const host=editor?($("main")||document.body):($("#panel-teacher")||$("main")||document.body);const p=document.createElement("section");p.id="v72-cat";p.className="v80-teacher-cat-tool";'
          if old not in s:
              raise SystemExit('Host CAT lama tidak ditemukan')
          s=s.replace(old,new,1)
          s=s.replace('Ringan, langsung, dan hanya memuat kendali kelas.','Kendali CAT adalah salah satu alat di Ruang Guru. Perangkat pembelajaran tetap tersedia pada panel yang sama.',1)
          old_insert=';host.prepend(p);'
          new_insert=';const anchor=$(".panel-heading",host);if(anchor)anchor.insertAdjacentElement("afterend",p);else host.prepend(p);'
          if old_insert not in s:
              raise SystemExit('Titik penempatan CAT tidak ditemukan')
          s=s.replace(old_insert,new_insert,1)
          p.write_text(s,encoding='utf-8')

          for filename in ['index.html','akses-guru.html']:
              p=Path(filename)
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'app-config\.js\?v=\d+', 'app-config.js?v=80', s)
              p.write_text(s,encoding='utf-8')

          p=Path('service-worker.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'const CACHE_NAME="paibp-smart-v\d+[^\"]*";', 'const CACHE_NAME="paibp-smart-v80-worship-teacher-static";', s, count=1)
          s=s.replace('quran-kemenag-runtime|service-worker', 'quran-kemenag-runtime|worship-restore|service-worker')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/v80-restore-worship-teacher.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-config.js teacher-cat-v72.js index.html akses-guru.html service-worker.js .github/workflows/v80-restore-worship-teacher.yml
          git commit -m 'V80 restore complete worship simulation and full teacher portal'
          git push
