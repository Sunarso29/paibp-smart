name: V84 final portal audit
on:
  push:
    paths:
      - '.github/workflows/v84-audit-portal.yml'
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply visual and icon guard to portal pages only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          pages=['index.html','akses-guru.html','fitur.html','mapel-lain.html','literasi-digital.html','artikel-islam.html','about-spensus.html','contact.html','privacy.html','terms.html','support.html']
          for name in pages:
              p=Path(name)
              if not p.exists(): raise SystemExit(f'missing portal page: {name}')
              text=p.read_text(encoding='utf-8')
              if 'visual-v84.css?v=84' not in text:
                  text=text.replace('</head>','<link rel="stylesheet" href="visual-v84.css?v=84"></head>',1)
              if 'icon-guard-v84.css?v=84' not in text:
                  text=text.replace('</head>','<link rel="stylesheet" href="icon-guard-v84.css?v=84"></head>',1)
              p.write_text(text,encoding='utf-8')
          p=Path('app-config.js')
          text=p.read_text(encoding='utf-8')
          if 'style("icon-guard-v84.css")' not in text:
              text=text.replace('style("visual-v84.css");','style("visual-v84.css");\n  style("icon-guard-v84.css");',1)
          p.write_text(text,encoding='utf-8')
          p=Path('service-worker.js')
          text=p.read_text(encoding='utf-8')
          if 'icon-guard-v84' not in text:
              text=text.replace('visual-v84|','visual-v84|icon-guard-v84|',1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Audit exact source document structures
        shell: bash
        run: |
          cat > /tmp/v84-audit.js <<'JS'
          const fs=require('fs');
          global.window=global;
          ['teacher-docs-v84c-vii.js','teacher-docs-v84c-viii.js','teacher-docs-v84c-ix.js'].forEach(f=>require(process.cwd()+'/'+f));
          const D=global.PAIBP_TEACHER_DOCS_V84C;
          const expected={VII:{CP:2,ATP:4,KKTP:6,PROTA:4,PROMES:32},VIII:{CP:2,ATP:4,KKTP:7,PROTA:5,PROMES:32},IX:{CP:2,ATP:3,KKTP:6,PROTA:4,PROMES:32}};
          const report={build:'84',status:'PASS',documentFormats:{},checks:{}};
          for(const [grade,docs] of Object.entries(expected)){
            report.documentFormats[grade]={};
            for(const [doc,shape] of Object.entries(docs)){
              const rec=D?.[grade]?.[doc];
              if(!rec) throw new Error(`${grade} ${doc}: missing`);
              const tables=(rec.b||[]).filter(x=>x[0]==='t').map(x=>x[1]);
              if(!tables.includes(shape)) throw new Error(`${grade} ${doc}: expected ${shape}, got ${tables}`);
              report.documentFormats[grade][doc]={source:rec.s,tableColumns:tables,distinctRequiredShape:shape,ok:true};
            }
          }
          const teacher=fs.readFileSync('akses-guru.html','utf8');
          const config=fs.readFileSync('app-config.js','utf8');
          const sw=fs.readFileSync('service-worker.js','utf8');
          const pages=['index.html','akses-guru.html','fitur.html','mapel-lain.html','literasi-digital.html','artikel-islam.html','about-spensus.html','contact.html','privacy.html','terms.html','support.html'];
          report.checks.exactVII=teacher.includes('teacher-docs-v84c-vii.js?v=84');
          report.checks.exactVIII=teacher.includes('teacher-docs-v84c-viii.js?v=84');
          report.checks.exactIX=teacher.includes('teacher-docs-v84c-ix.js?v=84');
          report.checks.renderer=teacher.includes('teacher-docs-v84.js?v=84');
          report.checks.noManualVII=!["teacher-v84-vii-cp.js","teacher-v84-vii-atp.js","teacher-v84-vii-kktp.js","teacher-v84-vii-prota.js","teacher-v84-vii-promes.js"].some(x=>teacher.includes(x));
          report.checks.teacherVisual=teacher.includes('teacher-docs-v84.css?v=84')&&teacher.includes('visual-v84.css?v=84')&&teacher.includes('icon-guard-v84.css?v=84');
          report.checks.configV84=/const VERSION = "84";/.test(config)&&config.includes('style("visual-v84.css")')&&config.includes('style("icon-guard-v84.css")');
          report.checks.oldCpOverlayRemoved=!config.includes('cp2026-source-v83.js');
          report.checks.serviceWorkerV84=sw.includes('paibp-smart-v84-source-docs-static')&&sw.includes('visual-v84')&&sw.includes('icon-guard-v84');
          report.checks.portalPages=pages.every(name=>{const x=fs.readFileSync(name,'utf8');return x.includes('visual-v84.css?v=84')&&x.includes('icon-guard-v84.css?v=84');});
          report.checks.iconGuard=fs.readFileSync('icon-guard-v84.css','utf8').includes('.nav-svg')&&fs.readFileSync('icon-guard-v84.css','utf8').includes('visibility:visible!important');
          if(Object.values(report.checks).some(v=>v!==true)) throw new Error(JSON.stringify(report.checks));
          fs.writeFileSync('v84-audit.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          JS
          node /tmp/v84-audit.js
          node --check teacher-docs-v84.js
      - name: Commit audited portal state
        shell: bash
        run: |
          rm -f .github/workflows/v84-audit-portal.yml .github/workflows/v84-audit-final.yml .github/workflows/v84-exact-vii.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V84 PASS exact CP ATP KKTP Prota Promes and icon-safe portal visual"
          git push
