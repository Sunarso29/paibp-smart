name: V78 Quran Kemenag local database

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v78-quran-kemenag-local.yml'

permissions:
  contents: write

jobs:
  build-quran:
    if: contains(github.event.head_commit.message, 'V78 one-time build local Quran Kemenag database')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import Quran Kemenag-derived local snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p quran-kemenag/surah
          for n in $(seq 1 114); do
            curl --fail --silent --show-error --location \
              --retry 3 --retry-delay 1 \
              "https://raw.githubusercontent.com/rioastamal/quran-json/master/surah/${n}.json" \
              -o "quran-kemenag/surah/${n}.json"
          done

      - name: Validate and build manifest
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path('quran-kemenag/surah')
          manifest=[]
          total_ayah=0
          for n in range(1,115):
              p=root/f'{n}.json'
              data=json.loads(p.read_text(encoding='utf-8'))
              s=data[str(n)]
              count=int(s.get('number_of_ayah') or len(s.get('text',{})))
              if len(s.get('text',{})) != count:
                  raise SystemExit(f'Surah {n}: jumlah ayat tidak cocok')
              total_ayah += count
              manifest.append({
                  'number': n,
                  'name': s.get('name',''),
                  'name_latin': s.get('name_latin',''),
                  'number_of_ayah': count
              })
          if total_ayah != 6236:
              raise SystemExit(f'Total ayat {total_ayah}, seharusnya 6236')
          pathlib.Path('quran-kemenag/manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, separators=(',',':')),
              encoding='utf-8'
          )
          source = '''# Database Al Qur'an lokal PAIBP SMART SMP\n\nSnapshot V78 ini disalin ke repository agar pembaca Al Qur'an berjalan di dalam aplikasi dan tidak mengalihkan pengguna ke website lain.\n\nSumber snapshot: rioastamal/quran-json. Repository sumber menyatakan bahwa sumber utama ayat dan terjemahannya berasal dari situs/aplikasi resmi Qur'an Kemenag.\n\nAcuan resmi mutakhir: API Qur'an Kemenag LPMQ untuk Mushaf Standar Indonesia (rasm Usmani), yang memerlukan pendaftaran dan token dari LPMQ.\n\nValidasi build: 114 surat dan 6.236 ayat.\n'''
          pathlib.Path('quran-kemenag/SOURCE.md').write_text(source, encoding='utf-8')
          print('Validated: 114 surah,', total_ayah, 'ayah')
          PY

      - name: Activate V78 internal Quran reader only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app-config.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('v77-colorful-v39-plus-v76-root-fix','v78-quran-kemenag-local-plus-v76-root-fix')
          s=s.replace('const VERSION = "77";','const VERSION = "78";')
          s=s.replace('button.dataset.v77','button.dataset.v78').replace('button.dataset.v77 = "1"','button.dataset.v78 = "1"')
          s=s.replace('PAIBP V77 visual runtime','PAIBP V78 visual runtime')
          s=s.replace('PAIBP V77 workspace core','PAIBP V78 workspace core')
          needle='      await ensureIslamicLite();\n      window.__PAIBP_WORKSPACE_CORE_READY__ = true;'
          repl='      await ensureIslamicLite();\n      /* Override pengalihan Quran lama: pembaca V78 membaca database lokal di repository. */\n      await script("quran-kemenag-runtime-v78.js");\n      window.__PAIBP_WORKSPACE_CORE_READY__ = true;'
          if needle not in s:
              raise SystemExit('Titik pemasangan runtime Quran V78 tidak ditemukan')
          s=s.replace(needle,repl,1)
          p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          import re
          s=re.sub(r'app-config\.js\?v=\d+', 'app-config.js?v=78', s)
          p.write_text(s,encoding='utf-8')

          p=Path('service-worker.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('paibp-smart-v77-static','paibp-smart-v78-static').replace('paibp-smart-v76-static','paibp-smart-v78-static')
          s=s.replace('service-worker/i.test(url.pathname)', 'quran-kemenag|quran-kemenag-runtime|service-worker/i.test(url.pathname)')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit V78 Quran-only repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-config.js index.html service-worker.js quran-kemenag
          git commit -m 'V78 internal Quran Kemenag database and reader' || exit 0
          git push
