name: V84 recover VII source data
on:
  push:
    paths:
      - '.github/workflows/v84-recover-vii.yml'
permissions:
  contents: write
jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover complete VII bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,base64,gzip
          src=Path('.github/workflows/v84-data-vii.yml').read_text(encoding='utf-8')
          m=re.search(r"s='([^']+)'",src)
          if not m: raise SystemExit('V84 VII payload not found')
          Path('teacher-docs-v84c-vii.js').write_bytes(gzip.decompress(base64.b64decode(m.group(1))))
          PY
          node --check teacher-docs-v84c-vii.js
      - name: Commit recovered bundle
        run: |
          rm -f .github/workflows/v84-recover-vii.yml .github/workflows/v84-data-vii.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V84 complete Kelas VII source bundle"
          git push
# retrigger V84 recovery
