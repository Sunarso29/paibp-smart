name: V82 CP2025 cleanup

on:
  push:
    paths:
      - '.github/workflows/v82-cp2025-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install libraries
        run: pip install python-docx openpyxl
      - name: Run V82 cleanup
        run: python tools/v82_cleanup.py
      - name: Commit V82
        shell: bash
        run: |
          rm -f .github/workflows/v82-cp2025-cleanup.yml tools/v82_cleanup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "V82 clean CP2025 national references tables terminology and source docs"
          git push
