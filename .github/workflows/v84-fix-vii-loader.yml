name: V84 fix VII direct source loader
on:
  push:
    paths:
      - '.github/workflows/v84-fix-vii-loader.yml'
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use five direct VII source files
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('akses-guru.html')
          text=p.read_text(encoding='utf-8')
          old='<script src="teacher-docs-v84c-vii.js?v=84"></script>'
          new=''.join([
            '<script src="teacher-v84-vii-cp.js?v=84"></script>',
            '<script src="teacher-v84-vii-atp.js?v=84"></script>',
            '<script src="teacher-v84-vii-kktp.js?v=84"></script>',
            '<script src="teacher-v84-vii-prota.js?v=84"></script>',
            '<script src="teacher-v84-vii-promes.js?v=84"></script>'
          ])
          text=text.replace(old,new)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Validate source files
        run: |
          node --check teacher-v84-vii-cp.js
          node --check teacher-v84-vii-atp.js
          node --check teacher-v84-vii-kktp.js
          node --check teacher-v84-vii-prota.js
          node --check teacher-v84-vii-promes.js
          node --check teacher-docs-v84c-viii.js
          node --check teacher-docs-v84c-ix.js
          node --check teacher-docs-v84.js
      - name: Commit loader fix
        run: |
          rm -f .github/workflows/v84-fix-vii-loader.yml .github/workflows/v84-data-vii.yml .github/workflows/v84-recover-vii.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V84 load all five Kelas VII source documents directly"
          git push
