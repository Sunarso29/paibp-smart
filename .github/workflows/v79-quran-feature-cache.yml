name: V79 Quran feature restore cache refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v79-quran-feature-cache.yml'

permissions:
  contents: write

jobs:
  activate-v79:
    if: contains(github.event.head_commit.message, 'V79 trigger Quran feature restore cache refresh')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Activate V79 cache bust only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('app-config.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('v78-quran-kemenag-local-plus-v76-root-fix','v79-quran-feature-restore-plus-v76-root-fix')
          s=s.replace('const VERSION = "78";','const VERSION = "79";')
          s=s.replace('button.dataset.v78','button.dataset.v79')
          s=s.replace('button.dataset.v78 = "1"','button.dataset.v79 = "1"')
          s=s.replace('PAIBP V78 visual runtime','PAIBP V79 visual runtime')
          s=s.replace('PAIBP V78 workspace core','PAIBP V79 workspace core')
          p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'app-config\.js\?v=\d+', 'app-config.js?v=79', s)
          p.write_text(s,encoding='utf-8')

          p=Path('service-worker.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'const CACHE_NAME="[^"]+";', 'const CACHE_NAME="paibp-smart-v79-quran-feature-static";', s, count=1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/v79-quran-feature-cache.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-config.js index.html service-worker.js .github/workflows/v79-quran-feature-cache.yml
          git commit -m 'V79 activate restored Quran features and colorful Islamic menu' || exit 0
          git push
