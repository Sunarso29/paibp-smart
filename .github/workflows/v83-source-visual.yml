name: V83 source CP2026 and visual restore

on:
  push:
    paths:
      - '.github/workflows/v83-source-visual.yml'

permissions:
  contents: write

jobs:
  activate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Activate V83 without changing learning content
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app=Path('app-config.js')
          t=app.read_text(encoding='utf-8')
          t=t.replace('v82-cp2025-cleanup-plus-v81-classroom','v83-source-cp2026-visual-plus-v82',1)
          t=t.replace('const VERSION = "82";','const VERSION = "83";',1)

          marker='  style("mobile-fix-v70.css");'
          if 'style("visual-v83.css")' not in t:
              t=t.replace(marker, marker+'\n  /* V83: lapisan visual saja; tidak mengubah konten atau struktur data. */\n  style("visual-v83.css");',1)

          old='script("cp2025-loader-v48.js").then(() => script("cp2025-exact-v56.js")).then(() => script("cp2025-cleanup-v82.js")).catch(() => false)'
          new='script("cp2025-loader-v48.js").then(() => script("cp2025-exact-v56.js")).then(() => script("cp2025-cleanup-v82.js")).then(() => script("cp2026-source-v83.js")).catch(() => false)'
          if old in t:
              t=t.replace(old,new,1)
          elif 'script("cp2026-source-v83.js")' not in t:
              raise SystemExit('CP2025 teacher loader chain not found; refusing broad edit')
          app.write_text(t,encoding='utf-8')

          for name in ['index.html','akses-guru.html','kendali-editor.html']:
              p=Path(name)
              if p.exists():
                  s=p.read_text(encoding='utf-8')
                  s=re.sub(r'app-config\.js\?v=\d+', 'app-config.js?v=83', s)
                  p.write_text(s,encoding='utf-8')

          sw=Path('service-worker.js')
          s=sw.read_text(encoding='utf-8')
          s=re.sub(r'const CACHE_NAME="paibp-smart-v\d+[^";]*";', 'const CACHE_NAME="paibp-smart-v83-source-visual-static";', s)
          pattern='learning-guard|cp2025-cleanup|cp2025-loader|cp2025-exact|cat-session|service-worker'
          replacement='learning-guard|cp2025-cleanup|cp2025-loader|cp2025-exact|cp2026-source|visual-v83|cat-session|service-worker'
          if 'cp2026-source' not in s:
              s=s.replace(pattern,replacement)
          sw.write_text(s,encoding='utf-8')

          assert 'const VERSION = "83";' in app.read_text(encoding='utf-8')
          assert 'style("visual-v83.css")' in app.read_text(encoding='utf-8')
          assert 'script("cp2026-source-v83.js")' in app.read_text(encoding='utf-8')
          PY
      - name: Commit V83 activation
        shell: bash
        run: |
          rm -f .github/workflows/v83-source-visual.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "V83 restore attached-source CP2026 and vivid visual layer only"
          git push
