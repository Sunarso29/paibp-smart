name: V84 final document and visual audit
on:
  push:
    paths:
      - '.github/workflows/v84-audit-final.yml'
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Activate icon guard everywhere
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for p in Path('.').glob('*.html'):
              text=p.read_text(encoding='utf-8')
              if 'visual-v84.css?v=84' not in text:
                  text=text.replace('</head>','<link rel="stylesheet" href="visual-v84.css?v=84"></head>',1)
              if 'icon-guard-v84.css?v=84' not in text:
                  text=text.replace('</head>','<link rel="stylesheet" href="icon-guard-v84.css?v=84"></head>',1)
              p.write_text(text,encoding='utf-8')
          p=Path('app-config.js')
          text=p.read_text(encoding='utf-8')
          if 'style("icon-guard-v84.css")' not in text:
              text=text.replace('style("visual-v84.css");','style("visual-v84.css");\n  style("icon-guard-v84.css");',1)
          p.write_text(text,encoding='utf-8')
          p=Path('service-worker.js')
          text=p.read_text(encoding='utf-8')
          if 'icon-guard-v84' not in text:
              text=text.replace('visual-v84|','visual-v84|icon-guard-v84|',1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Audit source structures
        shell: bash
        run: |
          cat > /tmp/audit-v84.js <<'JS'
          const fs=require('fs');
          global.window=global;
          [
            'teacher-v84-vii-cp.js','teacher-v84-vii-atp.js','teacher-v84-vii-kktp.js','teacher-v84-vii-prota.js','teacher-v84-vii-promes.js',
            'teacher-docs-v84c-viii.js','teacher-docs-v84c-ix.js'
          ].forEach(f=>require(process.cwd()+'/'+f));
          const D=global.PAIBP_TEACHER_DOCS_V84C;
          const exp={
            VII:{CP:2,ATP:4,KKTP:6,PROTA:4,PROMES:32},
            VIII:{CP:2,ATP:4,KKTP:7,PROTA:5,PROMES:32},
            IX:{CP:2,ATP:3,KKTP:6,PROTA:4,PROMES:32}
          };
          const result={build:'84',status:'PASS',grades:{},checks:{}};
          for(const [grade,docs] of Object.entries(exp)){
            result.grades[grade]={};
            for(const [doc,need] of Object.entries(docs)){
              if(!D?.[grade]?.[doc]) throw new Error(`${grade} ${doc} missing`);
              const cols=(D[grade][doc].b||[]).filter(x=>x[0]==='t').map(x=>x[1]);
              if(!cols.includes(need)) throw new Error(`${grade} ${doc} expected ${need} columns, got ${cols}`);
              result.grades[grade][doc]={source:D[grade][doc].s,tableColumns:cols,requiredShape:need,ok:true};
            }
          }
          const teacher=fs.readFileSync('akses-guru.html','utf8');
          const config=fs.readFileSync('app-config.js','utf8');
          const sw=fs.readFileSync('service-worker.js','utf8');
          result.checks.teacherDirectVII=['teacher-v84-vii-cp.js','teacher-v84-vii-atp.js','teacher-v84-vii-kktp.js','teacher-v84-vii-prota.js','teacher-v84-vii-promes.js'].every(x=>teacher.includes(x));
          result.checks.viiiBundle=teacher.includes('teacher-docs-v84c-viii.js');
          result.checks.ixBundle=teacher.includes('teacher-docs-v84c-ix.js');
          result.checks.renderer=teacher.includes('teacher-docs-v84.js');
          result.checks.teacherVisual=teacher.includes('teacher-docs-v84.css?v=84')&&teacher.includes('visual-v84.css?v=84')&&teacher.includes('icon-guard-v84.css?v=84');
          result.checks.configV84=/const VERSION = "84";/.test(config)&&config.includes('icon-guard-v84.css');
          result.checks.oldCp2026OverlayRemoved=!config.includes('cp2026-source-v83.js');
          result.checks.serviceWorkerV84=sw.includes('paibp-smart-v84-source-docs-static')&&sw.includes('icon-guard-v84');
          result.checks.publicVisual=[...fs.readdirSync('.').filter(x=>x.endsWith('.html'))].every(x=>fs.readFileSync(x,'utf8').includes('visual-v84.css?v=84')&&fs.readFileSync(x,'utf8').includes('icon-guard-v84.css?v=84'));
          if(Object.values(result.checks).some(v=>v!==true)) throw new Error('Visual/runtime audit failed: '+JSON.stringify(result.checks));
          fs.writeFileSync('v84-audit.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result,null,2));
          JS
          node /tmp/audit-v84.js
          node --check teacher-docs-v84.js
      - name: Commit verified state
        shell: bash
        run: |
          rm -f .github/workflows/v84-audit-final.yml .github/workflows/v84-fix-vii-loader.yml .github/workflows/v84-data-viii.yml .github/workflows/v84-data-ix.yml .github/workflows/v84-activate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V84 audited distinct teacher formats and icon-safe vivid visual"
          git push
# retrigger final V84 audit
