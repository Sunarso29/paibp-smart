name: V77 colorful UI cache refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v77-index-refresh.yml'

permissions:
  contents: write

jobs:
  refresh-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Switch public loader to V77
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s2 = re.sub(r'app-config\.js\?v=\d+', 'app-config.js?v=77', s)
          if s2 == s and 'app-config.js?v=77' not in s:
              raise SystemExit('app-config loader not found in index.html')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit refresh and remove one-time workflow
        run: |
          rm -f .github/workflows/v77-index-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/v77-index-refresh.yml
          git commit -m 'V77 activate colorful V39 UI and worship simulation'
          git push
