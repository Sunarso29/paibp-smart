name: V85 visual only
on:
  push:
    paths:
      - '.github/workflows/v85-visual-only.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V85 visual-only layer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Only portal/public pages already enrolled in V84 visual system.
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              if 'visual-v84.css?v=84' not in s:
                  continue
              if 'visual-v85.css?v=85' not in s:
                  marker='<link rel="stylesheet" href="visual-v84.css?v=84">'
                  add=marker+'<link rel="stylesheet" href="visual-v85.css?v=85"><link rel="stylesheet" href="icon-depth-v85.css?v=85">'
                  if marker in s:
                      s=s.replace(marker,add,1)
                  else:
                      s=s.replace('</head>','<link rel="stylesheet" href="visual-v85.css?v=85"><link rel="stylesheet" href="icon-depth-v85.css?v=85"></head>',1)
              s=re.sub(r'app-config\.js\?v=84', 'app-config.js?v=85', s)
              p.write_text(s,encoding='utf-8')

          # App loader: visual only; no content/runtime feature changes.
          p=Path('app-config.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('const VERSION = "84";','const VERSION = "85";',1)
          s=s.replace('realtimeManagedBy: "v84-source-faithful-teacher-docs"','realtimeManagedBy: "v85-visual-only-source-faithful-teacher-docs"',1)
          if 'style("visual-v85.css")' not in s:
              s=s.replace('style("visual-v84.css");','style("visual-v84.css");\n  style("visual-v85.css");\n  style("icon-depth-v85.css");',1)
          p.write_text(s,encoding='utf-8')

          # Service worker: cache/version only; feature logic untouched.
          p=Path('service-worker.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('paibp-smart-v84-source-docs-static','paibp-smart-v85-visual-static')
          if 'visual-v85' not in s:
              s=s.replace('visual-v84|', 'visual-v84|visual-v85|icon-depth-v85|')
          p.write_text(s,encoding='utf-8')

          # Remove temporary workflow after it has done its one job.
          Path('.github/workflows/v85-visual-only.yml').unlink(missing_ok=True)
          PY
          node --check app-config.js
          grep -q 'paibp-smart-v85-visual-static' service-worker.js
          grep -q 'visual-v85.css?v=85' index.html
          grep -q 'icon-depth-v85.css?v=85' akses-guru.html
      - name: Commit V85 activation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V85 activate visual-only Gen Alpha Z polish with readable icons"
          git push
