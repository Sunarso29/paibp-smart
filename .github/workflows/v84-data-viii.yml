name: V84 source data VIII
on:
  push:
    paths:
      - '.github/workflows/v84-data-viii.yml'
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode VIII source data
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip
          s=''
          Path('teacher-docs-v84c-viii.js').write_bytes(gzip.decompress(base64.b64decode(s)))
          PY
      - run: |
          rm -f .github/workflows/v84-data-viii.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -m "V84 add complete Kelas VIII source documents" && git push
