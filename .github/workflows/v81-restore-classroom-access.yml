name: V81 restore classroom access

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v81-restore-classroom-access.yml'

permissions:
  contents: write

jobs:
  restore:
    if: contains(github.event.head_commit.message, 'V81 trigger restore student NISN mobile gate and teacher material locks')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore classroom architecture
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # --- app-config V81 ---
          p=Path('app-config.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('v80-worship-teacher-restore-plus-v79-quran','v81-classroom-access-plus-v80-worship-v79-quran')
          s=s.replace('const VERSION = "80";','const VERSION = "81";',1)
          s=s.replace('PAIBP V80 visual runtime','PAIBP V81 visual runtime')
          s=s.replace('PAIBP V80 workspace core','PAIBP V81 workspace core')
          s=s.replace('PAIBP V80 Portal Guru','PAIBP V81 Portal Guru')

          # Learning guard must load with full workspace core.
          needle='''        "docx-export.js",\n        "script.js"\n      ]);'''
          repl='''        "docx-export.js",\n        "script.js"\n      ]);\n      /* V81: pulihkan kebijakan bab berurutan dan penguncian materi guru/editor. */\n      style("learning-guard-v48.css");\n      await script("learning-guard-v48.js");'''
          if needle not in s:
              raise SystemExit('workspace core insertion point not found')
          s=s.replace(needle,repl,1)

          # Phone-only student access gate. Teachers/editors are exempt.
          anchor='''  function studentGameGate() {'''
          mobile_code='''  function isStudentPhone() {\n    const role = String(document.body?.dataset.portalRole || "").toLowerCase();\n    const file = page;\n    if (role === "guru" || file === "akses-guru.html" || file === "kendali-editor.html") return true;\n    const ua = navigator.userAgent || "";\n    const phoneUA = /iPhone|iPod|Windows Phone|IEMobile|Opera Mini|Android.+Mobile|Mobile Safari/i.test(ua);\n    return phoneUA && Number(navigator.maxTouchPoints || 1) > 0;\n  }\n\n  function showStudentPhoneGate() {\n    let gate = document.getElementById("v81-phone-gate");\n    if (!gate) {\n      gate = document.createElement("div");\n      gate.id = "v81-phone-gate";\n      gate.style.cssText = "position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;padding:18px;background:rgba(2,35,30,.94);backdrop-filter:blur(10px)";\n      gate.innerHTML = '<section style="width:min(540px,100%);padding:28px;border-radius:28px;background:#fff;color:#173b33;box-shadow:0 30px 90px rgba(0,0,0,.35);text-align:center"><div style="font-size:3rem">📱</div><span style="display:block;margin-top:8px;font-size:.72rem;font-weight:900;letter-spacing:.1em;color:#08745e">AKSES RUANG MURID</span><h2 style="margin:8px 0 10px;color:#143b33">Gunakan HP murid</h2><p style="margin:0;line-height:1.65;color:#5d716b">Ruang Murid diwajibkan dibuka melalui HP. Login NISN, kamera depan, lokasi, identitas kelas, dan kendali guru diterapkan pada perangkat tersebut.</p><button type="button" data-v81-close-phone style="margin-top:18px;min-height:46px;padding:10px 18px;border:0;border-radius:14px;background:#08745e;color:#fff;font-weight:900">Kembali</button></section>';\n      document.body.append(gate);\n      gate.querySelector("[data-v81-close-phone]")?.addEventListener("click", () => gate.remove());\n    }\n    return gate;\n  }\n\n'''
          if anchor not in s:
              raise SystemExit('studentGameGate anchor not found')
          s=s.replace(anchor,mobile_code+anchor,1)

          pattern=re.compile(r'''  function studentGameGate\(\) \{.*?\n  \}\n\n  function init\(\) \{''',re.S)
          new_gate='''  function studentGameGate() {\n    let busy = false;\n    document.addEventListener("click", async (event) => {\n      const button = event.target.closest('[data-open-panel="student"],[data-open-panel="games"]');\n      if (!button || busy) return;\n      const name = button.dataset.openPanel;\n\n      if (name === "student" && window.__PAIBP_STUDENT_GATE_BYPASS__ === true) {\n        openPanel("student");\n        return;\n      }\n\n      event.preventDefault();\n      event.stopImmediatePropagation();\n\n      if (name === "student") {\n        if (!isStudentPhone()) { showStudentPhoneGate(); return; }\n        busy = true;\n        button.setAttribute("aria-busy", "true");\n        try {\n          /* Login/CAT harus siap sebelum Ruang Murid dibuka. */\n          await Promise.all([loadCat(), loadWorkspaceCore()]);\n          const cat = window.PAIBP_CAT_V69 || window.PAIBP_CAT_V67 || window.PAIBP_CAT_V65;\n          if (cat?.openStudent) cat.openStudent();\n          else if (cat?.showLogin) cat.showLogin();\n        } finally {\n          button.removeAttribute("aria-busy");\n          busy = false;\n        }\n        return;\n      }\n\n      openPanel("games");\n      if (window.__PAIBP_WORKSPACE_CORE_READY__) return;\n      busy = true;\n      button.setAttribute("aria-busy", "true");\n      await loadWorkspaceCore();\n      button.removeAttribute("aria-busy");\n      busy = false;\n    }, true);\n  }\n\n  function init() {'''
          if not pattern.search(s):
              raise SystemExit('studentGameGate block not found')
          s=pattern.sub(new_gate,s,count=1)

          # Preload the small CAT/login runtime on index so NISN intercept is present immediately.
          old='''      ensureVisualRuntime();\n      studentGameGate();'''
          new='''      ensureVisualRuntime();\n      loadCat().catch(() => {});\n      studentGameGate();'''
          if old not in s:
              raise SystemExit('index init point not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # --- CAT runtime: export reliable openStudent and bypass app-config only after permissions succeed. ---
          p=Path('cat-session-v67.js')
          s=p.read_text(encoding='utf-8')
          old='''  function openStudentPanel(){allowStudentOpen=true;const b=$("[data-open-panel='student']");if(b)b.click();else $("#panel-student,[data-panel='student']")?.removeAttribute("hidden");allowStudentOpen=false;setTimeout(()=>lockIdentityFields(),50)}'''
          new='''  function openStudentPanel(){allowStudentOpen=true;window.__PAIBP_STUDENT_GATE_BYPASS__=true;const b=$("[data-open-panel='student']");if(b)b.click();else $("#panel-student,[data-panel='student']")?.removeAttribute("hidden");window.__PAIBP_STUDENT_GATE_BYPASS__=false;allowStudentOpen=false;setTimeout(()=>lockIdentityFields(),50)}'''
          if old not in s:
              raise SystemExit('openStudentPanel not found')
          s=s.replace(old,new,1)

          old='''  function interceptStudent(e){const b=e.target.closest('[data-open-panel="student"]');if(!b||allowStudentOpen||privileged())return;e.preventDefault();e.stopImmediatePropagation();const saved=parse(localStorage.getItem(KEYS.identity),null),lc=linkClass();if(saved?.nisn && (!IS_CAT_LINK || normalizeClass(saved.className).code===lc.code)){beginStudent(saved)}else showLogin()}'''
          new='''  function openStudentAccess(){const saved=parse(localStorage.getItem(KEYS.identity),null),lc=linkClass();if(saved?.nisn && /^\\d{10}$/.test(String(saved.nisn)) && (!IS_CAT_LINK || normalizeClass(saved.className).code===lc.code)){beginStudent(saved)}else showLogin()}\n  function interceptStudent(e){const b=e.target.closest('[data-open-panel="student"]');if(!b||allowStudentOpen||privileged())return;e.preventDefault();e.stopImmediatePropagation();openStudentAccess()}'''
          if old not in s:
              raise SystemExit('interceptStudent not found')
          s=s.replace(old,new,1)

          old='''window.PAIBP_CAT_V65=window.PAIBP_CAT_V66=window.PAIBP_CAT_V67=window.PAIBP_CAT_V69=Object.freeze({version:VERSION,showLogin,normalizeClass,refreshTeacherClasses})'''
          new='''window.PAIBP_CAT_V65=window.PAIBP_CAT_V66=window.PAIBP_CAT_V67=window.PAIBP_CAT_V69=Object.freeze({version:VERSION,showLogin,openStudent:openStudentAccess,normalizeClass,refreshTeacherClasses})'''
          if old not in s:
              raise SystemExit('CAT export not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # --- Learning guard: restore teacher/editor material locking through Cloudflare proxy. ---
          p=Path('learning-guard-v48.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('const CONFIGURED = /^https:\\\/\\\\/script\\\\.google\\\\.com\\\\/macros\\\\/s\\\\/[^/]+\\\\/exec(?:\\\\?.*)?$/i.test(ENDPOINT);',
                      'const CONFIGURED = (() => { try { return new URL(ENDPOINT).protocol === "https:"; } catch { return false; } })();')
          # If exact escaped form differs, handle source literal.
          s=re.sub(r'const CONFIGURED = /\^https:[^;]+?\.test\(ENDPOINT\);', 'const CONFIGURED = (() => { try { return new URL(ENDPOINT).protocol === "https:"; } catch { return false; } })();', s, count=1)

          editor_func='''  function isEditor() {\n    const file = (location.pathname.split("/").pop() || "").toLowerCase();\n    return file === "kendali-editor.html"\n      || sessionStorage.getItem(EDITOR_KEY) === "true"\n      || localStorage.getItem(EDITOR_KEY) === "true"\n      || document.body?.dataset.teacherOwner === "yes";\n  }'''
          replacement=editor_func+'''\n\n  function isTeacher() {\n    const file = (location.pathname.split("/").pop() || "").toLowerCase();\n    const role = String(document.body?.dataset.portalRole || "").toLowerCase();\n    const gateway = String(document.body?.dataset.privateGateway || "").toLowerCase();\n    return file === "akses-guru.html" || role === "guru" || gateway === "guru";\n  }\n\n  const canManage = () => isEditor() || isTeacher();'''
          if editor_func not in s:
              raise SystemExit('isEditor function not found')
          s=s.replace(editor_func,replacement,1)

          s=s.replace('if (isEditor() || Number(chapter.number) === 1) return "";','if (canManage() || Number(chapter.number) === 1) return "";')
          s=s.replace('if (!studentActive || isEditor()) return;','if (!studentActive || canManage()) return;')
          s=s.replace('if (lockedButton && studentActive && !isEditor()) {','if (lockedButton && studentActive && !canManage()) {')
          s=s.replace('if (isEditor()) renderEditorPanel();','if (canManage()) renderEditorPanel();')
          s=s.replace('if (!isEditor() || !chapters.length) return;','if (!canManage() || !chapters.length) return;')
          s=s.replace('if (isEditor() && event.target.closest','if (canManage() && event.target.closest')
          s=s.replace('if (isEditor()) { renderEditorPanel(); loadRemotePolicy(); }','if (canManage()) { renderEditorPanel(); loadRemotePolicy(); }')
          s=s.replace('Bab ini dikunci langsung oleh editor.','Bab ini dikunci langsung oleh guru/editor.')
          s=s.replace('KENDALI EDITOR • AKSES MURID','KENDALI GURU / EDITOR • AKSES MURID')
          s=s.replace('Tersimpan pada perangkat editor. Sinkronisasi daring belum aktif.','Tersimpan pada perangkat pengelola. Sinkronisasi daring belum aktif.')
          s=s.replace('authorName: teacherIdentity()','authorName: teacherIdentity()')
          p.write_text(s,encoding='utf-8')

          # Cache bust pages.
          for filename in ['index.html','akses-guru.html']:
              p=Path(filename); s=p.read_text(encoding='utf-8')
              s=re.sub(r'app-config\.js\?v=\d+', 'app-config.js?v=81', s)
              p.write_text(s,encoding='utf-8')

          # Service worker V81.
          p=Path('service-worker.js'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'const CACHE_NAME="paibp-smart-v\d+[^\"]*";', 'const CACHE_NAME="paibp-smart-v81-classroom-access-static";', s, count=1)
          s=s.replace('quran-kemenag-runtime|worship-restore|service-worker', 'quran-kemenag-runtime|worship-restore|learning-guard|cat-session|service-worker')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/v81-restore-classroom-access.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-config.js cat-session-v67.js learning-guard-v48.js index.html akses-guru.html service-worker.js .github/workflows/v81-restore-classroom-access.yml
          git commit -m 'V81 restore NISN mobile student gate and teacher material locks'
          git push
