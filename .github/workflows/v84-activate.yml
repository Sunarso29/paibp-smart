name: V84 activate source docs and vivid visual
on:
  push:
    paths:
      - '.github/workflows/v84-activate.yml'
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Activate V84
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          s=''
          Path('teacher-docs-v84.js').write_bytes(gzip.decompress(base64.b64decode(s)))
          for p in Path('.').glob('*.html'):
              text=p.read_text(encoding='utf-8')
              if 'visual-v84.css?v=84' not in text:
                  text=text.replace('</head>','<link rel="stylesheet" href="visual-v84.css?v=84"></head>',1)
              text=re.sub(r'app-config\.js\?v=\d+','app-config.js?v=84',text)
              p.write_text(text,encoding='utf-8')
          p=Path('akses-guru.html')
          text=p.read_text(encoding='utf-8')
          if 'teacher-docs-v84.css?v=84' not in text:
              text=text.replace('</head>','<link rel="stylesheet" href="teacher-docs-v84.css?v=84"></head>',1)
          marker='<script src="app-config.js?v=84"></script>'
          scripts=''.join(['<script src="teacher-docs-v84c-vii.js?v=84"></script>','<script src="teacher-docs-v84c-viii.js?v=84"></script>','<script src="teacher-docs-v84c-ix.js?v=84"></script>','<script src="teacher-docs-v84.js?v=84"></script>'])
          if 'teacher-docs-v84c-vii.js?v=84' not in text:
              text=text.replace(marker,scripts+marker,1)
          p.write_text(text,encoding='utf-8')
          p=Path('app-config.js')
          text=p.read_text(encoding='utf-8')
          text=re.sub(r'const VERSION = "\d+";','const VERSION = "84";',text,count=1)
          text=re.sub(r'realtimeManagedBy: "[^"]+"','realtimeManagedBy: "v84-source-faithful-teacher-docs"',text,count=1)
          text=text.replace('.then(() => script("cp2026-source-v83.js"))','')
          if 'style("visual-v84.css")' not in text:
              text=text.replace('style("visual-v83.css");','style("visual-v83.css");\n  style("visual-v84.css");',1)
          if 'style("teacher-docs-v84.css")' not in text:
              text=text.replace('if (page === "akses-guru.html") {','if (page === "akses-guru.html") {\n      style("teacher-docs-v84.css");',1)
          p.write_text(text,encoding='utf-8')
          p=Path('service-worker.js')
          text=p.read_text(encoding='utf-8')
          text=re.sub(r'const CACHE_NAME="[^"]+";','const CACHE_NAME="paibp-smart-v84-source-docs-static";',text,count=1)
          if 'teacher-docs-v84' not in text:
              text=text.replace('visual-v83|','visual-v83|visual-v84|teacher-docs-v84|teacher-v84|',1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Validate runtime
        run: node --check teacher-docs-v84.js
      - name: Commit activation
        shell: bash
        run: |
          rm -f .github/workflows/v84-activate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V84 activate distinct source-faithful teacher formats and vivid visual"
          git push
