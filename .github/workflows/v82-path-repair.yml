name: V82 path repair

on:
  push:
    paths:
      - '.github/workflows/v82-path-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align Hadits technical filenames
        shell: bash
        run: |
          while IFS= read -r -d '' f; do
            n="${f//-hadis-/-hadits-}"
            mkdir -p "$(dirname "$n")"
            git mv "$f" "$n"
          done < <(find . -depth -type f -name '*-hadis-*' -print0)
      - name: Commit repair
        shell: bash
        run: |
          rm -f .github/workflows/v82-path-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "V82 align Hadits source and preview file paths"
          git push
