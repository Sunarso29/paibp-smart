name: V75 cache bust index

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v75-cache-bust.yml'

permissions:
  contents: write

jobs:
  patch-index:
    if: contains(github.event.head_commit.message, 'V75 one-time cache bust')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update loader version in index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=s
          for v in ('37','71','72','73','74'):
              s=s.replace(f'app-config.js?v={v}', 'app-config.js?v=75')
          if s==old:
              print('No index change needed')
          else:
              p.write_text(s, encoding='utf-8')
              print('index.html updated to app-config.js?v=75')
          PY
      - name: Commit index cache bust
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'V75 cache bust app-config loader'
          git push
