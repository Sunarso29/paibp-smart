name: V76 index cache bust

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v76-index-cache-bust.yml'

permissions:
  contents: write

jobs:
  patch-index:
    if: contains(github.event.head_commit.message, 'V76 one-time index cache bust')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update app-config version in index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          import re
          s2=re.sub(r'app-config\.js\?v=\d+', 'app-config.js?v=76', s)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit cache bust
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'V76 use portal root fix loader'
          git push
