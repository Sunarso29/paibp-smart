<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Reset PAIBP SMART V58</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#063e34,#145b8f);font-family:Arial,sans-serif;color:#173b33}.box{width:min(560px,100%);padding:30px;border-radius:28px;background:#fff;box-shadow:0 30px 90px rgba(0,0,0,.28);text-align:center}.logo{width:90px;height:90px;object-fit:contain;padding:8px;border:2px solid #f5c95d;border-radius:22px;background:#fffdf4}h1{margin:16px 0 8px;font-size:clamp(1.45rem,5vw,2.2rem)}p{line-height:1.6;color:#58716a}.bar{height:10px;margin:20px 0;border-radius:99px;background:#e7f1ed;overflow:hidden}.bar i{display:block;height:100%;width:15%;background:linear-gradient(90deg,#08745d,#f5c95d);animation:run 1.5s ease-in-out forwards}@keyframes run{to{width:100%}}strong{display:block;color:#08745d}</style></head><body><main class="box"><img class="logo" src="logo-spensus.png" alt="Logo SMP Negeri 1 Susukan"><h1>Menyiapkan PAIBP SMART V58</h1><p>Cache lama, service worker lama, dan tampilan V57 sedang dibersihkan.</p><div class="bar"><i></i></div><strong id="status">Memulai pembersihan…</strong></main><script>(async()=>{const s=document.querySelector('#status');try{s.textContent='Menghapus cache lama…';const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));s.textContent='Memperbarui service worker…';const regs=await navigator.serviceWorker?.getRegistrations?.()||[];await Promise.all(regs.map(r=>r.unregister()));Object.keys(localStorage).filter(k=>/paibp-smart-v5[0-7]-cache-reset/i.test(k)).forEach(k=>localStorage.removeItem(k));localStorage.setItem('paibp-smart-v58-cache-reset','done');s.textContent='Selesai. Membuka aplikasi…';setTimeout(()=>location.replace('index.html?v=58-final-audit-'+Date.now()),700)}catch(e){s.textContent='Pembersihan selesai sebagian. Membuka aplikasi…';setTimeout(()=>location.replace('index.html?v=58-final-audit-'+Date.now()),900)}})();</script></body></html>
