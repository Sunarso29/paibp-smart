<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pemulihan PAIBP SMART V49 Gemini</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#073f34;color:#fff;font-family:Arial,sans-serif}
    .box{width:min(88vw,520px);padding:32px;border-radius:24px;background:#fff;color:#123f36;text-align:center}
    .spin{width:46px;height:46px;margin:auto;border:5px solid #dcece7;border-top-color:#0a7f68;border-radius:50%;animation:s .8s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
<link rel="stylesheet" href="visual-v84.css?v=84"><link rel="stylesheet" href="visual-v85.css?v=85"><link rel="stylesheet" href="icon-depth-v85.css?v=85"></head>
<body>
  <main class="box">
    <div class="spin"></div>
    <h1>Memulihkan PAIBP SMART</h1>
    <p>Membersihkan cache lama dan membuka Spensus AI Gemini V49.</p>
  </main>
  <script>
    (async()=>{
      try{
        localStorage.removeItem("paibp-smart-v49-cache-reset");
        if("caches" in window){
          for(const key of await caches.keys()) await caches.delete(key);
        }
        if("serviceWorker" in navigator){
          for(const reg of await navigator.serviceWorker.getRegistrations()) await reg.unregister();
        }
      }catch{}
      setTimeout(()=>location.replace("index.html?v=49&fresh="+Date.now()),900);
    })();
  </script>
<script src="icon-art-v85.js?v=85" defer></script></body>
</html>
