<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset PAIBP SMART V55</title><style>body{margin:0;display:grid;place-items:center;min-height:100vh;background:linear-gradient(135deg,#063f35,#123a63);font-family:Arial,sans-serif;color:white}.card{width:min(520px,calc(100% - 30px));padding:28px;border-radius:24px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);text-align:center}button{min-height:48px;padding:12px 18px;border:0;border-radius:14px;background:#f3ba32;color:#3d2c00;font-weight:900}</style><link rel="stylesheet" href="visual-v84.css?v=84"><link rel="stylesheet" href="visual-v85.css?v=85"><link rel="stylesheet" href="icon-depth-v85.css?v=85"></head><body><section class="card"><h1>PAIBP SMART V55</h1><p>Membersihkan cache lama dan memuat versi stabil.</p><button id="go">Bersihkan dan Buka Portal</button><p id="s"></p></section><script>async function reset(){const s=document.getElementById('s');s.textContent='Membersihkan…';try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));}Object.keys(localStorage).filter(k=>/paibp-smart-v5[0-4]-cache-reset/.test(k)).forEach(k=>localStorage.removeItem(k));localStorage.setItem('paibp-smart-v55-cache-reset','done');s.textContent='Selesai.';setTimeout(()=>location.replace('./index.html?v=55&refresh='+Date.now()),500);}catch(e){s.textContent='Gagal: '+e.message;}}document.getElementById('go').onclick=reset;reset();</script></body></html>
