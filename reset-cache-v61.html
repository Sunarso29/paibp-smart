<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset PAIBP SMART V61</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#053d34,#175c90,#7142a0);font-family:Arial,sans-serif;color:#14372f}.card{width:min(620px,100%);padding:30px;border-radius:28px;background:#fff;box-shadow:0 28px 80px rgba(0,0,0,.3);text-align:center}.icon{font-size:3rem}h1{margin:.4rem 0}.status{margin:18px 0;padding:14px;border-radius:14px;background:#edf8f4;font-weight:800}.go{display:inline-grid;place-items:center;min-height:48px;padding:0 22px;border-radius:14px;background:#08745d;color:#fff;text-decoration:none;font-weight:900}</style></head><body><main class="card"><div class="icon">✓</div><h1>Reset PAIBP SMART V61</h1><p>Cache lama, state CAT V59/V60, dan service worker lama sedang dibersihkan.</p><div class="status" id="status">Memproses…</div><a class="go" href="index.html">Buka PAIBP SMART</a></main><script>(async()=>{const status=document.getElementById('status');try{['paibp-smart-cat-context-v59','paibp-smart-cat-state-v59','paibp-smart-cat-expired-v59','paibp-smart-student-session-v60','paibp-smart-student-session-v61','paibp-smart-class-context-v56','paibp-smart-cat-session-v56'].forEach(k=>{localStorage.removeItem(k);sessionStorage.removeItem(k)});if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}localStorage.setItem('paibp-smart-v61-cache-reset','done');status.textContent='Reset berhasil. Silakan buka PAIBP SMART.'}catch(e){status.textContent='Reset selesai sebagian. Tutup browser lalu buka kembali.'}})();</script></body></html>
